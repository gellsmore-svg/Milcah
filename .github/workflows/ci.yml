name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]" "galeed @ git+https://github.com/gellsmore-svg/galeed" "keturah @ git+https://github.com/gellsmore-svg/keturah" fastapi httpx ruff
      - run: ruff check src tests || true
      - run: pytest -q
