[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milcah"
version = "0.5.0"
description = "Milcah — the Coherence Engine: recursive, multi-LLM coherence pressure-testing of frameworks and worldviews."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["coherence", "reasoning", "ontology", "llm", "epistemics", "agentic"]

dependencies = [
    "keturah>=0.1",  # LLM-interface manifest (build_manifest / to_mcp)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# MongoDB-backed snapshot store (FR10) — the shared family persistence layer.
mongo = ["pymongo>=4.6"]
# Delegate ontology debate to Mahalath (FR3): query its debated ontology for
# polysemy / staleness to inform placement. Needs mahalath + pymongo.
mahalath = ["mahalath>=1.1.0", "pymongo>=4.6"]
# LLM-backed extraction executed through Hoglah (FR2 quality path).
hoglah = ["hoglah>=0.10.4,<0.11"]
hoglah-kafka = ["hoglah>=0.10.4,<0.11", "confluent-kafka>=2.3"]
hoglah-rabbitmq = ["hoglah>=0.10.4,<0.11", "pika>=1.3"]
# Read-only snapshot viewer in the browser (milcah serve).
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# Emit coherence-run events onto the family trace spine (MILCAH_GALEED_ENABLED=1).
galeed = ["galeed>=0.1", "pymongo>=4.6"]
hoglah-redis = ["hoglah>=0.10.4,<0.11", "redis>=5.0"]

[project.scripts]
milcah = "milcah.cli:main"

[project.urls]
Homepage = "https://github.com/gellsmore-svg/Milcah"
Repository = "https://github.com/gellsmore-svg/Milcah"
Issues = "https://github.com/gellsmore-svg/Milcah/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting ruff's defaults: ruff 0.16
# widened those defaults, which silently turns a green gate red on a tool
# upgrade. This is the historical default set (pyflakes + the pycodestyle
# errors worth gating), so the gate means the same thing on every ruff version.
select = ["E4", "E7", "E9", "F"]
